name: Release

on:
  workflow_call:
    inputs:
      tested_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish or repair, for example v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paintmanager-stable-releases
  queue: max

jobs:
  github:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag || steps.select.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tested_sha || 'main' }}
          fetch-depth: 0
      - name: Select the tested main commit or published tag
        id: select
        env:
          BASE: ${{ inputs.tested_sha }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$BASE" ]]; then
            [[ "$BASE" == "$(git rev-parse HEAD)" ]]
            if [[ "$BASE" != "$(git rev-parse origin/main)" ]]; then
              echo "A newer main commit will run its own CI."
              exit 0
            fi
            git switch -C main "$BASE"
            echo "plan=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main
            git switch --detach "refs/tags/$TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.select.outputs.plan == 'true'
        with:
          node-version: 24
      - if: steps.select.outputs.plan == 'true'
        run: npm ci --ignore-scripts
      - name: Analyze commits since the last stable version
        id: plan
        if: steps.select.outputs.plan == 'true'
        run: npm run release:plan
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.plan.outputs.tag || steps.select.outputs.tag
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: steps.plan.outputs.tag || steps.select.outputs.tag
        run: python -m pip install -r requirements-dev.txt
      - name: Stamp mod versions and changelog
        if: steps.plan.outputs.tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: python tools/release.py prepare "$env:TAG"
      - name: Check release source on Windows
        if: steps.plan.outputs.tag || steps.select.outputs.tag
        shell: bash
        run: |
          set -euo pipefail
          python tools/localization.py --check
          python tools/manage.py check
          python -m unittest discover -s tests
      - name: Package and push the release commit and tag together
        if: steps.plan.outputs.tag
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/manage.py package
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CHANGELOG.md mod.json src/PaintManager/Scripts/paintmanager/config.lua
          git commit -m "chore(release): ${TAG#v}"
          git tag "$TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Publish verified GitHub Release assets
        if: steps.plan.outputs.tag || steps.select.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag || steps.select.outputs.tag }}
        run: python tools/release.py github "$env:TAG"

  nexus:
    needs: github
    if: needs.github.outputs.tag && needs.github.outputs.tag != 'v0.2.0'
    environment: nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ needs.github.outputs.tag }}
          persist-credentials: false
      - name: Download GitHub assets, check SHA-256 and inspect existing Nexus versions
        id: nexus
        env:
          GH_TOKEN: ${{ github.token }}
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          NEXUSMODS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
          TAG: ${{ needs.github.outputs.tag }}
        run: python3 tools/release.py nexus "$TAG"
      - name: Upload the release ZIP to the Nexus Main File
        if: steps.nexus.outputs.upload == 'true'
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          mod_id: ${{ vars.NEXUSMODS_MOD_ID }}
          filename: ${{ steps.nexus.outputs.archive }}
          display_name: PaintManager ${{ steps.nexus.outputs.version }}
          version: ${{ steps.nexus.outputs.version }}
          category: main
          update_mod_version: true
          changelog: ${{ steps.nexus.outputs.notes }}
